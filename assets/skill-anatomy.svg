<text x="44" y="86" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#1c1b1a" text-anchor="start" >skills/web/saas-landing/</text>
<text x="44" y="109" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#3d3b37" text-anchor="start" >  SKILL.md</text>
<text x="310" y="109" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#6f6e69" text-anchor="start" >入口：做什么 / 何时用 / 何时别用</text>
<text x="44" y="132" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#3d3b37" text-anchor="start" >  SOURCE.md</text>
<text x="310" y="132" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#6f6e69" text-anchor="start" >来源与许可记录</text>
<text x="44" y="155" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#3d3b37" text-anchor="start" >  CONTRIBUTORS</text>
<text x="310" y="155" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#6f6e69" text-anchor="start" >上游署名</text>
<text x="44" y="178" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#3d3b37" text-anchor="start" >  references/</text>
<text x="310" y="178" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#6f6e69" text-anchor="start" >规则、规范、语料</text>
<text x="44" y="201" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#3d3b37" text-anchor="start" >  templates/</text>
