<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
<rect x="0" y="0" width="1200" height="300" rx="0" fill="#FFFCF0" />
<text x="24" y="36" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#1c1b1a" text-anchor="start" >一个技能就是一个目录，AI 助手先读入口，再按需读其余文件</text>
