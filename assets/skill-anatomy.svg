<text x="44" y="224" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#3d3b37" text-anchor="start" >  assets/</text>
<text x="310" y="224" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#6f6e69" text-anchor="start" >图标、示例、配置</text>
<text x="44" y="247" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="13" font-weight="400" fill="#3d3b37" text-anchor="start" >  scripts/</text>
<text x="310" y="247" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#6f6e69" text-anchor="start" >校验与生成脚本</text>
<rect x="570" y="58" width="606" height="220" rx="10" fill="#ffffff" stroke="#e3e0d5" stroke-width="1.5" />
<circle cx="600" cy="88" r="14" fill="#c96442"/>
<text x="600" y="93" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="628" y="93" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#1c1b1a" text-anchor="start" >你描述需求</text>
<text x="760" y="93" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#6f6e69" text-anchor="start" >说清产物、场景、风格与不要什么</text>
<circle cx="600" cy="136" r="14" fill="#c96442"/>
<text x="600" y="141" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="628" y="141" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#1c1b1a" text-anchor="start" >助手命中技能</text>
<text x="760" y="141" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#6f6e69" text-anchor="start" >按 description 判断该读哪一目录</text>
<circle cx="600" cy="184" r="14" fill="#c96442"/>
<text x="600" y="189" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="628" y="189" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#1c1b1a" text-anchor="start" >读规则与模板</text>
<text x="760" y="189" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#6f6e69" text-anchor="start" >只加载需要的文件，不整库灌进上下文</text>
<circle cx="600" cy="232" r="14" fill="#c96442"/>
<text x="600" y="237" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="628" y="237" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#1c1b1a" text-anchor="start" >产出界面</text>
<text x="760" y="237" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#6f6e69" text-anchor="start" >HTML / TSX / SVG，可直接落进项目</text>
